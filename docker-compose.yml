version: '3.8'

services:
  blockchain:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./blockchain:/app
    command: sh -c "npm install && npx hardhat node"
    ports:
      - "8545:8545"

  backend:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./skillchain.db
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
      - CONTRACT_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - FRONTEND_URL=http://localhost:5173
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - blockchain

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
